<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エネミオン 賭博卓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14100f;
    --panel: #1d1714;
    --panel-2: #241c18;
    --edge: #3a2c24;
    --ink: #ece3d2;
    --ink-dim: #a89a87;
    --red: #b23a2e;
    --red-glow: #e2543f;
    --gold: #c9a227;
    --paper: #ede3d0;
    --green: #4f7a52;
    --font-display: 'Shippori Mincho', serif;
    --font-body: 'Zen Kaku Gothic New', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(178,58,46,0.08), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }
  .screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .hidden{ display:none !important; }

  /* ---- 入り口 ---- */
  .ticket{
    width: min(420px, 92vw);
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 36px 32px 28px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:18px; height:18px;
    background: var(--bg);
    border-radius:50%;
    top:50%; transform: translateY(-50%);
  }
  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }
  h1.title{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 34px;
    text-align:center;
    margin: 0 0 26px;
    letter-spacing: 0.06em;
  }
  label{
    display:block;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  input[type="text"], input[type="number"], select, textarea{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--edge);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 3px;
    outline: none;
    margin-bottom: 14px;
  }
  textarea{ font-family: var(--font-body); resize: vertical; min-height: 54px; }
  input:focus, select:focus, textarea:focus{ border-color: var(--gold); }

  .role-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }
  .role-btn{
    background: var(--panel-2);
    border: 1px solid var(--edge);
    color: var(--ink-dim);
    padding: 12px 8px;
    font-family: var(--font-body);
    font-size: 13px;
    border-radius: 3px;
    cursor:pointer;
    text-align:center;
    transition: all .15s ease;
  }
  .role-btn:hover{ border-color: var(--gold); color: var(--ink); }
  .role-btn.selected{
    border-color: var(--red-glow);
    color: var(--paper);
    background: linear-gradient(180deg, rgba(178,58,46,0.25), rgba(178,58,46,0.06));
  }

  .seal-btn{
    width:100%;
    padding: 14px;
    border-radius: 3px;
    border: 1px solid var(--red-glow);
    background: linear-gradient(180deg, var(--red), #8f2c22);
    color: var(--paper);
    font-family: var(--font-display);
    font-size: 18px;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: box-shadow .2s ease, transform .05s ease;
  }
  .seal-btn:hover{ box-shadow: 0 0 24px rgba(226,84,63,0.35); }
  .seal-btn:active{ transform: translateY(1px); }
  .seal-btn:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }

  .ghost-btn{
    background: var(--panel-2);
    border: 1px solid var(--edge);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 3px;
    cursor:pointer;
    font-family: var(--font-body);
    font-size: 13px;
  }
  .ghost-btn:hover{ border-color: var(--gold); }
  .ghost-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  .error-note{
    color: var(--red-glow);
    font-size: 12px;
    margin-top: -6px;
    margin-bottom: 14px;
    min-height: 14px;
  }

  /* ---- 共通の卓ラッパー ---- */
  .wrap{
    width: min(820px, 94vw);
    margin: 0 auto;
    padding: 28px 6px 60px;
  }
  .wrap-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--edge);
    padding-bottom: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .wrap-head h2{
    font-family: var(--font-display);
    font-size: 24px;
    margin:0;
  }
  .room-code{
    font-family: var(--font-mono);
    color: var(--gold);
    font-size: 13px;
  }
  .you-badge{
    display:inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper);
    background: var(--panel-2);
    border: 1px solid var(--edge);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  .members{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .member-card{
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .member-card .role-label{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.1em;
  }
  .member-card .member-name{ font-size: 14px; margin-top: 4px; }

  /* ---- マッチング待ち ---- */
  .wait-box{
    width: min(460px, 92vw);
    text-align:center;
  }
  .wait-dice{
    width: 84px; height:84px;
    margin: 0 auto 22px;
    border: 1px solid var(--red-glow);
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono);
    font-size: 40px;
    color: var(--gold);
    animation: spin-face 1.1s steps(4) infinite;
  }
  @keyframes spin-face{
    0%{ content: "1"; }
  }
  .wait-title{
    font-family: var(--font-display);
    font-size: 24px;
    margin-bottom: 8px;
  }
  .wait-sub{ color: var(--ink-dim); font-size: 13px; margin-bottom: 26px; }

  /* ---- 編成フェーズ ---- */
  .deck-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .card-form{
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 14px;
  }
  .card-form .slot-label{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .phase-actions{ display:flex; gap: 10px; align-items:center; margin-bottom: 24px; flex-wrap: wrap; }
  .ready-note{ font-size: 12px; color: var(--ink-dim); }

  /* ---- 対戦フェーズ ---- */
  .score-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 14px 18px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .score-side{ text-align:center; }
  .score-side .side-name{ font-size: 13px; color: var(--ink-dim); margin-bottom: 6px; }
  .pips{ display:flex; gap: 6px; justify-content:center; }
  .pip{ width:14px; height:14px; border-radius:50%; border:1px solid var(--edge); background: var(--panel-2); }
  .pip.filled{ background: var(--red-glow); border-color: var(--red-glow); }
  .turn-mid{ font-family: var(--font-mono); font-size: 12px; color: var(--gold); text-align:center; }

  .hand-section{ margin-bottom: 22px; }
  .hand-section h3{ font-family: var(--font-display); font-size: 15px; color: var(--ink-dim); margin: 0 0 10px; }
  .hand-cards{ display:flex; gap: 10px; flex-wrap: wrap; }
  .hand-card{
    width: 130px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 10px;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  .hand-card:hover{ border-color: var(--gold); }
  .hand-card.selected{ border-color: var(--red-glow); box-shadow: 0 0 14px rgba(226,84,63,0.3); }
  .hand-card.used{ opacity:0.3; cursor:not-allowed; }
  .hand-card .hc-num{ font-family: var(--font-mono); font-size: 20px; color: var(--paper); }
  .hand-card .hc-name{ font-size: 12px; margin: 4px 0; }
  .hand-card .hc-type{ font-size: 11px; color: var(--ink-dim); }

  .opp-hand-note{ color: var(--ink-dim); font-size: 13px; }

  .reveal-board{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .reveal-card{
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 16px;
  }
  .reveal-card .rc-side{ font-family: var(--font-mono); font-size: 11px; color: var(--gold); margin-bottom: 8px; }
  .reveal-card .rc-name{ font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
  .reveal-card .rc-num{ font-family: var(--font-mono); font-size: 30px; color: var(--paper); margin: 6px 0; }
  .reveal-card .rc-meta{ font-size: 12px; color: var(--ink-dim); margin-bottom: 6px; }
  .reveal-card .rc-effects{ font-size: 12px; white-space: pre-wrap; border-top: 1px dashed var(--edge); padding-top: 8px; margin-top: 8px; }

  .judge-panel{
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 22px;
  }
  .judge-panel h3{ font-family: var(--font-display); font-size: 15px; margin: 0 0 10px; color: var(--gold); }
  .judge-row{ display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-bottom: 10px; }
  .judge-row label{ margin:0; }
  .judge-row input[type=number]{ width: 80px; margin-bottom:0; }
  .winner-radios{ display:flex; gap: 14px; font-size: 13px; }
  .winner-radios label{ display:flex; align-items:center; gap:6px; color: var(--ink); font-size:13px; }

  .log-panel{
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 4px;
    padding: 16px;
  }
  .log-panel h3{ font-family: var(--font-display); font-size: 15px; margin: 0 0 12px; color: var(--ink-dim); }
  .log-list{ max-height: 220px; overflow-y: auto; display:flex; flex-direction:column; gap: 8px; margin-bottom: 14px; font-size: 13px; }
  .log-item{ border-bottom: 1px dashed var(--edge); padding-bottom: 6px; }
  .log-item .log-meta{ font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); margin-right: 8px; }
  .log-form{ display:flex; gap: 8px; }
  .log-form input[type="text"]{ margin-bottom:0; flex:1; }

  .result-banner{
    text-align:center;
    padding: 40px 20px;
    background: var(--panel);
    border: 1px solid var(--gold);
    border-radius: 4px;
    margin-bottom: 22px;
  }
  .result-banner .rb-title{ font-family: var(--font-display); font-size: 30px; color: var(--gold); margin-bottom: 10px; }
  .result-actions{ display:flex; gap: 10px; justify-content:center; flex-wrap: wrap; margin-top: 16px; }

  .leave-link{
    display:inline-block;
    margin-top: 20px;
    color: var(--ink-dim);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <!-- 入り口画面 -->
  <div id="entry-screen" class="screen">
    <div class="ticket">
      <h1 class="title">エネミオン</h1>

      <label for="input-room">合言葉（部屋の識別子）</label>
      <input type="text" id="input-room" placeholder="例：エネミオン" autocomplete="off">

      <label for="input-name">名乗る名（表示名）</label>
      <input type="text" id="input-name" placeholder="例：名無しの異能者" autocomplete="off">

      <label>モード</label>
      <div class="role-grid">
        <div class="role-btn selected" data-role="player">プレイヤー</div>
        <div class="role-btn" data-role="spectator">観戦</div>
        <div class="role-btn" data-role="judge">ジャッジ</div>
        <div class="role-btn" data-role="watch-only">閲覧のみ（匿名）</div>
      </div>

      <div class="error-note" id="entry-error"></div>

      <button class="seal-btn" id="btn-enter">入室</button>
    </div>
  </div>

  <!-- マッチング待ち画面 -->
  <div id="matching-screen" class="screen hidden">
    <div class="wait-box">
      <div class="wait-dice">?</div>
      <div class="wait-title">対戦相手を待っています</div>
      <div class="wait-sub">合言葉「<span id="match-room-code"></span>」でもう一人プレイヤーが入室すると自動的に始まります</div>
      <div class="members" id="match-members"></div>
      <div class="leave-link" id="btn-leave-matching">卓を離れる</div>
    </div>
  </div>

  <!-- プレイ画面 -->
  <div id="play-screen" class="screen hidden">
    <div class="wrap">
      <div class="wrap-head">
        <h2>賭博卓</h2>
        <span class="room-code" id="play-room-code"></span>
      </div>
      <div class="you-badge" id="you-badge"></div>

      <div class="members" id="play-members"></div>

      <!-- 編成フェーズ -->
      <div id="phase-build" class="hidden">
        <div class="deck-grid" id="deck-grid"></div>
        <div class="phase-actions">
          <button class="seal-btn" id="btn-deck-save" style="width:auto; padding:12px 22px;">デッキを保存</button>
          <button class="ghost-btn" id="btn-deck-ready">準備完了にする</button>
          <span class="ready-note" id="deck-error"></span>
        </div>
        <div class="ready-note" id="opponent-ready-note" style="margin-bottom:20px;"></div>
      </div>

      <!-- 対戦フェーズ -->
      <div id="phase-battle" class="hidden">
        <div class="score-bar">
          <div class="score-side">
            <div class="side-name" id="score-name-p1">プレイヤー1</div>
            <div class="pips" id="pips-p1"></div>
          </div>
          <div class="turn-mid" id="turn-indicator"></div>
          <div class="score-side">
            <div class="side-name" id="score-name-p2">プレイヤー2</div>
            <div class="pips" id="pips-p2"></div>
          </div>
        </div>

        <div class="hand-section" id="my-hand-section">
          <h3>あなたの手札</h3>
          <div class="hand-cards" id="my-hand"></div>
          <div style="margin-top:10px;">
            <button class="ghost-btn" id="btn-lock-card" disabled>この手を伏せて出す</button>
            <span class="ready-note" id="lock-status"></span>
          </div>
        </div>

        <div class="hand-section" id="opp-hand-section">
          <p class="opp-hand-note" id="opp-hand-note"></p>
        </div>

        <div id="reveal-btn-wrap" class="hidden" style="margin-bottom:20px;">
          <button class="seal-btn" id="btn-reveal" style="width:auto; padding:12px 22px;">せーの、公開する！</button>
        </div>

        <div id="reveal-board-wrap" class="hidden">
          <div class="reveal-board" id="reveal-board"></div>

          <div class="judge-panel" id="judge-panel">
            <h3>この番の裁定</h3>
            <div class="judge-row">
              <label style="margin:0;">タイプ相性</label>
              <span id="advantage-note" style="font-size:12px; color:var(--ink-dim);"></span>
            </div>
            <div class="judge-row">
              <label style="margin:0;">P1 効果補正</label>
              <input type="number" id="adj-p1" value="0">
              <label style="margin:0;">P2 効果補正</label>
              <input type="number" id="adj-p2" value="0">
            </div>
            <div class="judge-row">
              <label style="margin:0;">獲得ポイント</label>
              <input type="number" id="award-points" value="1" min="0">
            </div>
            <div class="judge-row winner-radios" id="winner-radios"></div>
            <button class="ghost-btn" id="btn-confirm-round">この番の結果を確定する</button>
            <span class="ready-note" id="confirm-note"></span>
          </div>
        </div>
      </div>

      <!-- 決着フェーズ -->
      <div id="phase-result" class="hidden">
        <div class="result-banner">
          <div class="rb-title" id="result-title"></div>
          <div class="ready-note" id="result-sub"></div>
          <div class="result-actions">
            <button class="ghost-btn" id="btn-rematch">同じデッキで再戦</button>
            <button class="ghost-btn" id="btn-rebuild">編成からやり直す</button>
          </div>
        </div>
      </div>

      <div class="log-panel">
        <h3>卓上の記録</h3>
        <div class="log-list" id="log-list"></div>
        <div class="log-form">
          <input type="text" id="input-log" placeholder="宣言・雑談などを記録する">
          <button class="ghost-btn" id="btn-log-send">記す</button>
        </div>
      </div>

      <div class="leave-link" id="btn-leave-play">卓を離れる</div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getDatabase, ref, set, update, push, onValue,
    onDisconnect, remove, serverTimestamp, get
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA6Y2XG4sWKHin4ZQjstzF0o9yUTVAQrFk",
    authDomain: "enemion.firebaseapp.com",
    databaseURL: "https://enemion-default-rtdb.firebaseio.com", // ※要確認: Firebaseコンソールの実際のURLに置き換える
    projectId: "enemion",
    storageBucket: "enemion.firebasestorage.app",
    messagingSenderId: "1024531797284",
    appId: "1:1024531797284:web:b5be7ef927434ec46b8fb1",
    measurementId: "G-XC45Q1N2QP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ------- 状態 -------
  let roomId = null;
  let memberId = null;
  let myRole = null;   // 'player1' | 'player2' | 'spectator' | 'judge' | 'watch-only'
  let myName = null;
  let listenersReady = false;
  let latestMembers = {};
  let latestDecks = {};
  let latestBattle = null;
  let mySelectedCardIndex = null;

  const TYPE_LABEL = { atk:'攻撃🔴', spd:'速度🔵', def:'防御🟢', uni:'万能🟡', spc:'特化🟣' };
  const SPECIES_LIST = ['エネミー','異能者','無能力者'];

  // ---- DOM refs ----
  const entryScreen = document.getElementById('entry-screen');
  const matchingScreen = document.getElementById('matching-screen');
  const playScreen = document.getElementById('play-screen');

  const inputRoom = document.getElementById('input-room');
  const inputName = document.getElementById('input-name');
  const entryError = document.getElementById('entry-error');
  const btnEnter = document.getElementById('btn-enter');
  const roleButtons = document.querySelectorAll('.role-btn');

  let selectedRoleKind = 'player';
  roleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      roleButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedRoleKind = btn.dataset.role;
    });
  });

  function sanitizeKey(str){ return str.trim().replace(/[.#$/\[\]]/g, '_'); }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
  function roleDisplay(slot){
    return {
      player1: 'プレイヤー1', player2: 'プレイヤー2',
      spectator: '観戦', judge: 'ジャッジ', 'watch-only': '閲覧のみ'
    }[slot] || slot;
  }
  const oppSlot = (slot) => slot === 'player1' ? 'player2' : 'player1';

  // ============ 入室処理 ============
  btnEnter.addEventListener('click', async () => {
    entryError.textContent = '';
    const roomRaw = inputRoom.value.trim();
    const nameRaw = inputName.value.trim();
    if(!roomRaw){ entryError.textContent = '合言葉を入力してください。'; return; }
    if(!nameRaw){ entryError.textContent = '名乗る名を入力してください。'; return; }

    roomId = sanitizeKey(roomRaw);
    myName = nameRaw;
    memberId = 'm_' + Math.random().toString(36).slice(2, 10);

    const membersRef = ref(db, `rooms/${roomId}/members`);
    const snap = await get(membersRef);
    const existing = snap.exists() ? snap.val() : {};

    let finalRole = selectedRoleKind;
    if(selectedRoleKind === 'player'){
      const takenSlots = Object.values(existing).map(m => m.slot).filter(Boolean);
      if(!takenSlots.includes('player1')) finalRole = 'player1';
      else if(!takenSlots.includes('player2')) finalRole = 'player2';
      else { entryError.textContent = 'プレイヤー枠は既に2人埋まっています。観戦かジャッジで入室してください。'; return; }
    } else if(selectedRoleKind === 'judge'){
      const hasJudge = Object.values(existing).some(m => m.slot === 'judge');
      if(hasJudge){ entryError.textContent = 'この卓には既にジャッジがいます。'; return; }
      finalRole = 'judge';
    } else if(selectedRoleKind === 'spectator'){ finalRole = 'spectator'; }
    else { finalRole = 'watch-only'; }

    myRole = finalRole;
    const myMemberRef = ref(db, `rooms/${roomId}/members/${memberId}`);
    await set(myMemberRef, { name: myName, slot: myRole, joinedAt: serverTimestamp() });
    onDisconnect(myMemberRef).remove();

    document.getElementById('match-room-code').textContent = roomRaw;
    document.getElementById('play-room-code').textContent = `合言葉: ${roomRaw}`;

    initRoomListeners();
  });

  // ============ リアルタイム購読の初期化 ============
  function initRoomListeners(){
    if(listenersReady) return;
    listenersReady = true;

    onValue(ref(db, `rooms/${roomId}/members`), (snap) => {
      latestMembers = snap.val() || {};
      renderMembers(document.getElementById('match-members'), latestMembers);
      renderMembers(document.getElementById('play-members'), latestMembers);
      routeScreens();
    });

    onValue(ref(db, `rooms/${roomId}/decks`), (snap) => {
      latestDecks = snap.val() || {};
      renderBuildPhase();
      renderOpponentReadyNote();
    });

    onValue(ref(db, `rooms/${roomId}/battle`), (snap) => {
      latestBattle = snap.val() || null;
      routeScreens();
      renderBattlePhase();
      renderResultPhase();
    });

    onValue(ref(db, `rooms/${roomId}/log`), (snap) => {
      const data = snap.val() || {};
      const items = Object.values(data).sort((a,b) => (a.ts||0) - (b.ts||0));
      const logList = document.getElementById('log-list');
      logList.innerHTML = '';
      items.slice(-60).forEach(item => {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `<span class="log-meta">${escapeHtml(item.from)}</span>${escapeHtml(item.text)}`;
        logList.appendChild(div);
      });
      logList.scrollTop = logList.scrollHeight;
    });

    document.getElementById('you-badge').textContent = `あなた: ${myName}（${roleDisplay(myRole)}）`;
  }

  function renderMembers(target, data){
    if(!target) return;
    target.innerHTML = '';
    Object.values(data).sort((a,b) => (a.slot > b.slot ? 1 : -1)).forEach(m => {
      const div = document.createElement('div');
      div.className = 'member-card';
      div.innerHTML = `<div class="role-label">${roleDisplay(m.slot)}</div><div class="member-name">${escapeHtml(m.name)}</div>`;
      target.appendChild(div);
    });
  }

  // ============ 画面遷移の判定 ============
  function routeScreens(){
    entryScreen.classList.add('hidden');

    const isPlayer = myRole === 'player1' || myRole === 'player2';
    const bothPresent = Object.values(latestMembers).some(m => m.slot==='player1') &&
                         Object.values(latestMembers).some(m => m.slot==='player2');

    if(isPlayer && !bothPresent){
      matchingScreen.classList.remove('hidden');
      playScreen.classList.add('hidden');
      return;
    }
    matchingScreen.classList.add('hidden');
    playScreen.classList.remove('hidden');

    const phase = latestBattle ? latestBattle.phase : 'build';
    document.getElementById('phase-build').classList.toggle('hidden', phase !== 'build');
    document.getElementById('phase-battle').classList.toggle('hidden', phase !== 'battle');
    document.getElementById('phase-result').classList.toggle('hidden', phase !== 'result');
  }

  document.getElementById('btn-leave-matching').addEventListener('click', leaveRoom);
  document.getElementById('btn-leave-play').addEventListener('click', leaveRoom);
  async function leaveRoom(){
    if(roomId && memberId){ await remove(ref(db, `rooms/${roomId}/members/${memberId}`)); }
    location.reload();
  }

  // ============ 編成フェーズ ============
  function emptyDeck(){
    return { ready:false, cards:[0,1,2,3].map(() => ({ name:'', number:null, species:'異能者', type:'atk', effects:'', flavor:'', used:false })) };
  }

  function renderBuildPhase(){
    if(myRole !== 'player1' && myRole !== 'player2') return; // 編成できるのはプレイヤーのみ
    const grid = document.getElementById('deck-grid');
    const myDeck = latestDecks[myRole] || emptyDeck();
    const isReady = !!myDeck.ready;

    grid.innerHTML = '';
    myDeck.cards.forEach((card, idx) => {
      const div = document.createElement('div');
      div.className = 'card-form';
      div.innerHTML = `
        <div class="slot-label">カード ${idx+1}</div>
        <label>カード名</label>
        <input type="text" data-f="name" data-i="${idx}" value="${escapeHtml(card.name)}" ${isReady?'disabled':''}>
        <div class="row2">
          <div>
            <label>数字(1-4)</label>
            <select data-f="number" data-i="${idx}" ${isReady?'disabled':''}>
              <option value="">-</option>
              ${[1,2,3,4].map(n => `<option value="${n}" ${card.number===n?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>
          <div>
            <label>種族</label>
            <select data-f="species" data-i="${idx}" ${isReady?'disabled':''}>
              ${SPECIES_LIST.map(s => `<option value="${s}" ${card.species===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>
        <label>タイプ</label>
        <select data-f="type" data-i="${idx}" ${isReady?'disabled':''}>
          ${Object.entries(TYPE_LABEL).map(([k,v]) => `<option value="${k}" ${card.type===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <label>効果（自由記述・pt自己管理）</label>
        <textarea data-f="effects" data-i="${idx}" ${isReady?'disabled':''}>${escapeHtml(card.effects)}</textarea>
        <label>説明（フレーバー）</label>
        <input type="text" data-f="flavor" data-i="${idx}" value="${escapeHtml(card.flavor)}" ${isReady?'disabled':''}>
      `;
      grid.appendChild(div);
    });

    document.getElementById('btn-deck-save').disabled = isReady;
    document.getElementById('btn-deck-ready').textContent = isReady ? '編成をやり直す' : '準備完了にする';
  }

  document.getElementById('btn-deck-save').addEventListener('click', async () => {
    const grid = document.getElementById('deck-grid');
    const deckErr = document.getElementById('deck-error');
    deckErr.textContent = '';
    const cards = [0,1,2,3].map(idx => {
      const get = (f) => grid.querySelector(`[data-f="${f}"][data-i="${idx}"]`).value;
      return {
        name: get('name').trim(),
        number: get('number') ? parseInt(get('number'),10) : null,
        species: get('species'),
        type: get('type'),
        effects: get('effects'),
        flavor: get('flavor'),
        used: false
      };
    });
    const numbers = cards.map(c => c.number);
    const validNumbers = [1,2,3,4].every(n => numbers.includes(n));
    if(!validNumbers){ deckErr.textContent = '数字は1〜4を重複なく1つずつ割り振ってください。'; return; }
    if(cards.some(c => !c.name)){ deckErr.textContent = '全てのカードにカード名を入力してください。'; return; }

    await set(ref(db, `rooms/${roomId}/decks/${myRole}`), { ready:false, cards });
    deckErr.textContent = 'デッキを保存しました。';
  });

  document.getElementById('btn-deck-ready').addEventListener('click', async () => {
    const myDeck = latestDecks[myRole] || emptyDeck();
    const newReady = !myDeck.ready;
    if(newReady && (!myDeck.cards || myDeck.cards.some(c => !c.name || !c.number))){
      document.getElementById('deck-error').textContent = '先にデッキを保存してください（全カード入力必須）。';
      return;
    }
    await update(ref(db, `rooms/${roomId}/decks/${myRole}`), { ready: newReady });

    if(newReady){
      const oppDeck = latestDecks[oppSlot(myRole)];
      if(oppDeck && oppDeck.ready){
        await maybeInitBattle();
      }
    }
  });

  function renderOpponentReadyNote(){
    if(myRole !== 'player1' && myRole !== 'player2') return;
    const opp = latestDecks[oppSlot(myRole)];
    const note = document.getElementById('opponent-ready-note');
    if(!note) return;
    note.textContent = opp && opp.ready ? '相手は準備完了しています。' : '相手はまだ編成中です。';
  }

  async function maybeInitBattle(){
    const battleSnap = await get(ref(db, `rooms/${roomId}/battle`));
    const cur = battleSnap.val();
    if(cur && cur.phase && cur.phase !== 'build') return; // 既に開始済み
    // 競合を減らすため player1 側が初期化を担当
    if(myRole !== 'player1') return;
    await set(ref(db, `rooms/${roomId}/battle`), {
      phase: 'battle',
      turn: 1,
      firstSlot: 'player1',
      points: { player1: 0, player2: 0 },
      picks: { player1: null, player2: null },
      revealed: false,
      winner: null
    });
    await push(ref(db, `rooms/${roomId}/log`), { from:'卓', text:'両者の準備が整い、対戦を開始します。', ts: Date.now() });
  }

  // ============ 対戦フェーズ ============
  function typeAdvantage(typeA, typeB){
    // 戻り値: 'A' | 'B' | null（有利側、なければnull）
    const cycle = { atk:'spd', spd:'def', def:'atk' };
    if(typeA==='spc' && typeB==='uni') return 'A';
    if(typeB==='spc' && typeA==='uni') return 'B';
    if(typeA==='spc' && ['atk','spd','def'].includes(typeB)) return 'B';
    if(typeB==='spc' && ['atk','spd','def'].includes(typeA)) return 'A';
    if(cycle[typeA] === typeB) return 'A';
    if(cycle[typeB] === typeA) return 'B';
    return null;
  }

  function renderBattlePhase(){
    if(!latestBattle || latestBattle.phase !== 'battle') return;
    const isPlayer = myRole === 'player1' || myRole === 'player2';

    document.getElementById('score-name-p1').textContent = memberName('player1');
    document.getElementById('score-name-p2').textContent = memberName('player2');
    renderPips('pips-p1', latestBattle.points.player1);
    renderPips('pips-p2', latestBattle.points.player2);
    document.getElementById('turn-indicator').textContent =
      `第${latestBattle.turn}ターン ／ 先手: ${memberName(latestBattle.firstSlot)}`;

    // 自分の手札
    const myHandSection = document.getElementById('my-hand-section');
    const oppHandSection = document.getElementById('opp-hand-section');
    if(isPlayer){
      myHandSection.classList.remove('hidden');
      const myDeck = latestDecks[myRole];
      const myHand = document.getElementById('my-hand');
      myHand.innerHTML = '';
      const myPick = latestBattle.picks ? latestBattle.picks[myRole] : null;
      (myDeck.cards || []).forEach((card, idx) => {
        const div = document.createElement('div');
        const isUsed = card.used;
        const isSelected = mySelectedCardIndex === idx;
        div.className = 'hand-card' + (isUsed ? ' used' : '') + (isSelected ? ' selected' : '');
        div.innerHTML = `<div class="hc-num">${card.number}</div><div class="hc-name">${escapeHtml(card.name)}</div><div class="hc-type">${TYPE_LABEL[card.type]}</div>`;
        if(!isUsed && !(myPick && myPick.locked)){
          div.addEventListener('click', () => {
            mySelectedCardIndex = idx;
            renderBattlePhase();
          });
        }
        myHand.appendChild(div);
      });
      document.getElementById('btn-lock-card').disabled = (mySelectedCardIndex === null) || (myPick && myPick.locked);
      document.getElementById('lock-status').textContent = (myPick && myPick.locked) ? 'あなたの選択は確定済みです。相手を待っています。' : '';
      oppHandSection.classList.add('hidden');
    } else {
      myHandSection.classList.add('hidden');
      oppHandSection.classList.remove('hidden');
      const p1Left = (latestDecks.player1?.cards || []).filter(c=>!c.used).length;
      const p2Left = (latestDecks.player2?.cards || []).filter(c=>!c.used).length;
      document.getElementById('opp-hand-note').textContent =
        `${memberName('player1')}: 残り${p1Left}枚 ／ ${memberName('player2')}: 残り${p2Left}枚`;
    }

    const p1Locked = latestBattle.picks && latestBattle.picks.player1 && latestBattle.picks.player1.locked;
    const p2Locked = latestBattle.picks && latestBattle.picks.player2 && latestBattle.picks.player2.locked;
    const bothLocked = p1Locked && p2Locked;
    const revealed = !!latestBattle.revealed;

    document.getElementById('reveal-btn-wrap').classList.toggle('hidden', !(bothLocked && !revealed));
    document.getElementById('reveal-board-wrap').classList.toggle('hidden', !revealed);

    if(revealed){ renderRevealBoard(); }
  }

  function memberName(slot){
    const m = Object.values(latestMembers).find(x => x.slot === slot);
    return m ? m.name : (slot==='player1' ? 'プレイヤー1' : 'プレイヤー2');
  }

  function renderPips(id, points){
    const el = document.getElementById(id);
    el.innerHTML = '';
    for(let i=0;i<3;i++){
      const span = document.createElement('span');
      span.className = 'pip' + (i < points ? ' filled' : '');
      el.appendChild(span);
    }
  }

  document.getElementById('btn-lock-card').addEventListener('click', async () => {
    if(mySelectedCardIndex === null) return;
    await update(ref(db, `rooms/${roomId}/battle/picks/${myRole}`), { cardIndex: mySelectedCardIndex, locked: true });
    await push(ref(db, `rooms/${roomId}/log`), { from: myName, text: '手を伏せて確定した。', ts: Date.now() });
  });

  document.getElementById('btn-reveal').addEventListener('click', async () => {
    await update(ref(db, `rooms/${roomId}/battle`), { revealed: true });
    await push(ref(db, `rooms/${roomId}/log`), { from:'卓', text:'両者、公開！', ts: Date.now() });
  });

  function renderRevealBoard(){
    const board = document.getElementById('reveal-board');
    const p1Idx = latestBattle.picks.player1.cardIndex;
    const p2Idx = latestBattle.picks.player2.cardIndex;
    const p1Card = latestDecks.player1.cards[p1Idx];
    const p2Card = latestDecks.player2.cards[p2Idx];

    board.innerHTML = [
      revealCardHtml('player1', p1Card),
      revealCardHtml('player2', p2Card)
    ].join('');

    const adv = typeAdvantage(p1Card.type, p2Card.type);
    const advNote = document.getElementById('advantage-note');
    advNote.textContent = adv === 'A' ? `${memberName('player1')}のタイプが有利（+1）`
      : adv === 'B' ? `${memberName('player2')}のタイプが有利（+1）`
      : 'タイプ相性はニュートラル';

    // 勝者候補を自動計算して初期選択
    const winnerRadios = document.getElementById('winner-radios');
    winnerRadios.innerHTML = `
      <label><input type="radio" name="winner" value="player1"> ${escapeHtml(memberName('player1'))}の勝ち</label>
      <label><input type="radio" name="winner" value="player2"> ${escapeHtml(memberName('player2'))}の勝ち</label>
      <label><input type="radio" name="winner" value="draw"> 引き分け</label>
    `;

    function recalcSuggestion(){
      const adjP1 = parseInt(document.getElementById('adj-p1').value || '0', 10);
      const adjP2 = parseInt(document.getElementById('adj-p2').value || '0', 10);
      let p1Total = p1Card.number + adjP1 + (adv==='A' ? 1 : 0);
      let p2Total = p2Card.number + adjP2 + (adv==='B' ? 1 : 0);
      let suggested = p1Total > p2Total ? 'player1' : (p2Total > p1Total ? 'player2' : 'draw');
      const radio = winnerRadios.querySelector(`input[value="${suggested}"]`);
      if(radio) radio.checked = true;
    }
    document.getElementById('adj-p1').addEventListener('input', recalcSuggestion);
    document.getElementById('adj-p2').addEventListener('input', recalcSuggestion);
    recalcSuggestion();

    // 判定操作の権限: ジャッジがいればジャッジのみ、いなければ両プレイヤー
    const hasJudge = Object.values(latestMembers).some(m => m.slot === 'judge');
    const canConfirm = hasJudge ? myRole === 'judge' : (myRole === 'player1' || myRole === 'player2');
    document.getElementById('btn-confirm-round').disabled = !canConfirm;
    document.getElementById('confirm-note').textContent = canConfirm ? '' :
      (hasJudge ? 'ジャッジの確定操作を待っています。' : '');
  }

  function revealCardHtml(slot, card){
    return `
      <div class="reveal-card">
        <div class="rc-side">${escapeHtml(memberName(slot))}</div>
        <div class="rc-name">${escapeHtml(card.name)}</div>
        <div class="rc-num">${card.number}</div>
        <div class="rc-meta">${escapeHtml(card.species)} ／ ${TYPE_LABEL[card.type]}</div>
        ${card.effects ? `<div class="rc-effects">${escapeHtml(card.effects)}</div>` : ''}
        ${card.flavor ? `<div class="rc-effects" style="font-style:italic; color:var(--ink-dim);">${escapeHtml(card.flavor)}</div>` : ''}
      </div>
    `;
  }

  document.getElementById('btn-confirm-round').addEventListener('click', async () => {
    const winnerChoice = document.querySelector('input[name="winner"]:checked');
    if(!winnerChoice) return;
    const winner = winnerChoice.value;
    const award = parseInt(document.getElementById('award-points').value || '1', 10);

    const p1Idx = latestBattle.picks.player1.cardIndex;
    const p2Idx = latestBattle.picks.player2.cardIndex;

    const updates = {};
    updates[`decks/player1/cards/${p1Idx}/used`] = true;
    updates[`decks/player2/cards/${p2Idx}/used`] = true;

    let newPoints = { ...latestBattle.points };
    if(winner === 'player1' || winner === 'player2'){
      newPoints[winner] = (newPoints[winner] || 0) + award;
    }
    updates['battle/points'] = newPoints;
    updates['battle/picks'] = { player1: null, player2: null };
    updates['battle/revealed'] = false;
    updates['battle/turn'] = latestBattle.turn + 1;
    updates['battle/firstSlot'] = oppSlot(latestBattle.firstSlot);

    const finished = newPoints.player1 >= 3 || newPoints.player2 >= 3;
    if(finished){
      updates['battle/phase'] = 'result';
      updates['battle/winner'] = newPoints.player1 >= 3 ? 'player1' : 'player2';
    }

    await update(ref(db, `rooms/${roomId}`), updates);
    mySelectedCardIndex = null;

    const winnerText = winner === 'draw' ? '引き分け' : `${memberName(winner)}の勝ち`;
    await push(ref(db, `rooms/${roomId}/log`), { from:'卓', text:`この番の結果: ${winnerText}（+${award}pt）`, ts: Date.now() });
    if(finished){
      await push(ref(db, `rooms/${roomId}/log`), { from:'卓', text:`勝負あり。${memberName(updates['battle/winner'])}の勝利。`, ts: Date.now() });
    }
  });

  // ============ 決着フェーズ ============
  function renderResultPhase(){
    if(!latestBattle || latestBattle.phase !== 'result') return;
    document.getElementById('result-title').textContent = `${memberName(latestBattle.winner)} の勝利！`;
    document.getElementById('result-sub').textContent =
      `最終ポイント　${memberName('player1')}: ${latestBattle.points.player1} － ${memberName('player2')}: ${latestBattle.points.player2}`;
  }

  document.getElementById('btn-rematch').addEventListener('click', async () => {
    const updates = {};
    updates['decks/player1/cards'] = (latestDecks.player1.cards || []).map(c => ({ ...c, used:false }));
    updates['decks/player2/cards'] = (latestDecks.player2.cards || []).map(c => ({ ...c, used:false }));
    updates['battle'] = {
      phase:'battle', turn:1, firstSlot:'player1',
      points:{player1:0, player2:0}, picks:{player1:null, player2:null},
      revealed:false, winner:null
    };
    await update(ref(db, `rooms/${roomId}`), updates);
    await push(ref(db, `rooms/${roomId}/log`), { from:'卓', text:'同じデッキで再戦を開始。', ts: Date.now() });
  });

  document.getElementById('btn-rebuild').addEventListener('click', async () => {
    const updates = {};
    updates['decks/player1/ready'] = false;
    updates['decks/player2/ready'] = false;
    updates['battle/phase'] = 'build';
    await update(ref(db, `rooms/${roomId}`), updates);
    await push(ref(db, `rooms/${roomId}/log`), { from:'卓', text:'編成からやり直します。', ts: Date.now() });
  });

  // ============ ログ送信 ============
  document.getElementById('btn-log-send').addEventListener('click', sendLog);
  document.getElementById('input-log').addEventListener('keydown', (e) => { if(e.key === 'Enter') sendLog(); });
  async function sendLog(){
    const inputLog = document.getElementById('input-log');
    const text = inputLog.value.trim();
    if(!text) return;
    await push(ref(db, `rooms/${roomId}/log`), { from: myName, text, ts: Date.now() });
    inputLog.value = '';
  }
</script>
</body>
</html>
