<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>効果カタログ管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="fatal-error-banner" class="hidden" style="position:fixed; top:0; left:0; right:0; background:#b23a2e; color:#fff; padding:12px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; z-index:9999; white-space:pre-wrap;"></div>

  <div class="screen">
    <div class="wrap wrap-wide">
      <div class="wrap-head">
        <h2>効果カタログ管理</h2>
      </div>
      <p class="ready-note" style="margin-bottom:20px;">
        ここで追加・編集・削除した効果は、対戦・デッキセット・ひとりでページの効果一覧にそのまま反映されます。<br>
        このページはナビゲーションからはリンクされていない、URLを知っている人だけが開ける管理用ページです。
      </p>

      <div id="admin-effect-form" style="background:var(--panel); border:1px solid var(--edge); border-radius:4px; padding:16px; margin-bottom:24px;">
        <h3 style="font-family:var(--font-display); font-size:16px; color:var(--gold); margin:0 0 12px;" id="form-title">新しい効果を追加</h3>
        <p class="ready-note" id="form-note" style="margin:-6px 0 10px;"></p>
        <input type="hidden" id="edit-effect-origin">
        <input type="hidden" id="edit-effect-id">

        <label>効果名</label>
        <input type="text" id="input-effect-name" placeholder="例：降り注ぐ威光">

        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <div style="flex:1; min-width:120px;">
            <label>pt（マイナスも可）</label>
            <input type="number" id="input-effect-pt" value="1">
          </div>
          <div style="flex:1; min-width:160px;">
            <label>区分</label>
            <select id="input-effect-category">
              <option value="ability">異能</option>
              <option value="skill">技能</option>
              <option value="">なし（デメリット効果など）</option>
            </select>
          </div>
        </div>

        <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="input-effect-ex" style="width:auto; margin:0;">
          <span>EX効果にする</span>
        </label>

        <label>効果テキスト</label>
        <textarea id="input-effect-text" rows="3" placeholder="効果の内容を書いてください"></textarea>

        <div class="phase-actions" style="margin-top:12px;">
          <button type="button" class="seal-btn" id="btn-effect-save" style="width:auto; padding:10px 22px;">保存</button>
          <button type="button" class="ghost-btn hidden" id="btn-effect-cancel-edit">編集をキャンセル</button>
          <span class="ready-note" id="effect-form-error"></span>
        </div>
      </div>

      <div style="margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input type="text" id="input-effect-search" placeholder="効果名・内容で検索…" style="flex:1; min-width:200px; margin-bottom:0;">
        <select id="select-effect-sort" style="width:auto; margin-bottom:0;">
          <option value="pt">並び替え：pt順</option>
          <option value="kana">並び替え：五十音順</option>
          <option value="new">並び替え：新しい順</option>
          <option value="old">並び替え：古い順</option>
        </select>
        <select id="select-effect-filter-pt" style="width:auto; margin-bottom:0;">
          <option value="">pt：すべて</option>
          <option value="1">1pt</option>
          <option value="2">2pt</option>
          <option value="3">3pt</option>
          <option value="4">4pt</option>
          <option value="6">6pt</option>
          <option value="-1">-1pt</option>
          <option value="-2">-2pt</option>
        </select>
        <select id="select-effect-filter-category" style="width:auto; margin-bottom:0;">
          <option value="">区分：すべて</option>
          <option value="ability">異能</option>
          <option value="skill">技能</option>
          <option value="none">なし（デメリット等）</option>
          <option value="ex">EX効果のみ</option>
        </select>
        <select id="select-effect-filter-origin" style="width:auto; margin-bottom:0;">
          <option value="">由来：すべて</option>
          <option value="builtin">既存の効果</option>
          <option value="admin">追加した効果</option>
        </select>
        <span class="ready-note" id="effect-count-note"></span>
      </div>

      <div id="admin-effect-list"></div>
    </div>
  </div>

<script type="module">
  import { db, ref, get, set, push, remove, onValue, escapeHtml, sanitizeKey, EFFECTS_CATALOG } from './shared.js';

  const listEl = document.getElementById('admin-effect-list');
  const searchInput = document.getElementById('input-effect-search');
  const countNote = document.getElementById('effect-count-note');
  const sortSelect = document.getElementById('select-effect-sort');
  const filterPtSelect = document.getElementById('select-effect-filter-pt');
  const filterCategorySelect = document.getElementById('select-effect-filter-category');
  const filterOriginSelect = document.getElementById('select-effect-filter-origin');
  let adminItems = {}; // globalEffectsCatalog（新規追加した効果。pushIdがキー）
  let overrideItems = {}; // globalEffectsOverrides（既存効果の上書き編集。sanitizeKey(名前)がキー）

  onValue(ref(db, 'globalEffectsCatalog'), (snap) => {
    adminItems = snap.val() || {};
    renderList();
  });
  onValue(ref(db, 'globalEffectsOverrides'), (snap) => {
    overrideItems = snap.val() || {};
    renderList();
  });

  function catLabel(category){
    return category === 'ability' ? '〈異能〉' : category === 'skill' ? '〈技能〉' : '';
  }

  // 一覧表示用に、コード本体の効果（上書きがあれば反映）＋新規追加した効果を1つのリストにまとめる
  function buildCombinedList(){
    const builtin = EFFECTS_CATALOG.map(e => {
      const ov = overrideItems[sanitizeKey(e.name)];
      return { origin: 'builtin', id: sanitizeKey(e.name), ...e, ...(ov || {}), name: e.name, overridden: !!ov, ts: ov ? (ov.ts || 0) : 0 };
    });
    const admin = Object.entries(adminItems).map(([id, e]) => ({ origin: 'admin', id, ...e, ts: e.ts || 0 }));
    return [...builtin, ...admin];
  }

  function renderList(){
    const q = searchInput.value.trim();
    const ptFilter = filterPtSelect.value;
    const categoryFilter = filterCategorySelect.value;
    const originFilter = filterOriginSelect.value;
    const sortMode = sortSelect.value;

    const all = buildCombinedList();
    let entries = all.filter(e => {
      if(q && !(e.name.includes(q) || (e.text || '').includes(q))) return false;
      if(ptFilter !== '' && String(e.pt) !== ptFilter) return false;
      if(categoryFilter === 'ability' && e.category !== 'ability') return false;
      if(categoryFilter === 'skill' && e.category !== 'skill') return false;
      if(categoryFilter === 'none' && e.category) return false;
      if(categoryFilter === 'ex' && !e.ex) return false;
      if(originFilter && e.origin !== originFilter) return false;
      return true;
    });

    if(sortMode === 'kana'){
      entries = entries.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    } else if(sortMode === 'new'){
      entries = entries.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    } else if(sortMode === 'old'){
      entries = entries.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    } else {
      entries = entries.sort((a, b) => (a.pt || 0) - (b.pt || 0));
    }

    countNote.textContent = `${entries.length}件（全${all.length}件）`;

    listEl.innerHTML = entries.map(e => `
      <div class="member-card" style="margin-bottom:10px;">
        <div class="role-label">
          ${e.pt}pt${e.ex ? '（EX）' : ''}${catLabel(e.category) ? ' ' + catLabel(e.category) : ''}
          ${e.origin === 'builtin' ? '<span style="opacity:0.6;">・既存</span>' : '<span style="opacity:0.6;">・追加分</span>'}
          ${e.overridden ? '<span style="color:var(--gold);">・編集済み</span>' : ''}
        </div>
        <div class="member-name">${escapeHtml(e.name)}</div>
        <div class="ready-note" style="margin-top:4px;">${escapeHtml(e.text || '')}</div>
        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="ghost-btn" data-edit-origin="${e.origin}" data-edit-id="${escapeHtml(e.id)}">編集</button>
          ${e.origin === 'admin' ? `<button type="button" class="ghost-btn" data-delete="${escapeHtml(e.id)}">削除</button>` : ''}
          ${e.origin === 'builtin' && e.overridden ? `<button type="button" class="ghost-btn" data-revert="${escapeHtml(e.id)}">編集を元に戻す</button>` : ''}
        </div>
      </div>
    `).join('') || '<p class="ready-note">該当する効果がありません。</p>';

    listEl.querySelectorAll('[data-edit-origin]').forEach(btn => {
      btn.addEventListener('click', () => {
        startEdit(btn.dataset.editOrigin, btn.dataset.editId);
      });
    });
    listEl.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const e = adminItems[btn.dataset.delete];
        if(!confirm(`「${e ? e.name : ''}」を削除しますか？`)) return;
        await remove(ref(db, `globalEffectsCatalog/${btn.dataset.delete}`));
      });
    });
    listEl.querySelectorAll('[data-revert]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('この効果への編集を取り消し、元の内容に戻しますか？')) return;
        await remove(ref(db, `globalEffectsOverrides/${btn.dataset.revert}`));
      });
    });
  }
  searchInput.addEventListener('input', renderList);
  sortSelect.addEventListener('change', renderList);
  filterPtSelect.addEventListener('change', renderList);
  filterCategorySelect.addEventListener('change', renderList);
  filterOriginSelect.addEventListener('change', renderList);

  function resetForm(){
    document.getElementById('edit-effect-origin').value = '';
    document.getElementById('edit-effect-id').value = '';
    document.getElementById('input-effect-name').value = '';
    document.getElementById('input-effect-name').disabled = false;
    document.getElementById('input-effect-pt').value = '1';
    document.getElementById('input-effect-ex').checked = false;
    document.getElementById('input-effect-category').value = 'ability';
    document.getElementById('input-effect-text').value = '';
    document.getElementById('form-title').textContent = '新しい効果を追加';
    document.getElementById('form-note').textContent = '';
    document.getElementById('btn-effect-cancel-edit').classList.add('hidden');
    document.getElementById('effect-form-error').textContent = '';
  }

  function startEdit(origin, id){
    const e = buildCombinedList().find(x => x.origin === origin && x.id === id);
    if(!e) return;
    document.getElementById('edit-effect-origin').value = origin;
    document.getElementById('edit-effect-id').value = id;
    document.getElementById('input-effect-name').value = e.name || '';
    document.getElementById('input-effect-name').disabled = (origin === 'builtin'); // 既存効果は名前で紐付けているため変更不可
    document.getElementById('input-effect-pt').value = e.pt != null ? e.pt : 1;
    document.getElementById('input-effect-ex').checked = !!e.ex;
    document.getElementById('input-effect-category').value = e.category || '';
    document.getElementById('input-effect-text').value = e.text || '';
    document.getElementById('form-title').textContent = `「${e.name}」を編集`;
    document.getElementById('form-note').textContent = origin === 'builtin' ? 'コード本体にある既存の効果です。名前は変更できません。' : '';
    document.getElementById('btn-effect-cancel-edit').classList.remove('hidden');
    document.getElementById('effect-form-error').textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('btn-effect-cancel-edit').addEventListener('click', resetForm);

  document.getElementById('btn-effect-save').addEventListener('click', async () => {
    const errEl = document.getElementById('effect-form-error');
    const name = document.getElementById('input-effect-name').value.trim();
    const ptRaw = document.getElementById('input-effect-pt').value;
    const pt = parseInt(ptRaw, 10);
    const ex = document.getElementById('input-effect-ex').checked;
    const category = document.getElementById('input-effect-category').value || null;
    const text = document.getElementById('input-effect-text').value.trim();

    if(!name){ errEl.textContent = '効果名を入力してください。'; return; }
    if(!text){ errEl.textContent = '効果テキストを入力してください。'; return; }
    if(Number.isNaN(pt)){ errEl.textContent = 'ptは数字で入力してください。'; return; }

    const origin = document.getElementById('edit-effect-origin').value;
    const id = document.getElementById('edit-effect-id').value;
    const ts = Date.now();

    if(origin === 'builtin'){
      // 既存効果の編集：名前をキーに、差分をglobalEffectsOverridesへ保存する
      await set(ref(db, `globalEffectsOverrides/${id}`), { pt, ex, category, text, ts });
    } else if(id){
      await set(ref(db, `globalEffectsCatalog/${id}`), { name, pt, ex, category, text, ts });
    } else {
      await push(ref(db, 'globalEffectsCatalog'), { name, pt, ex, category, text, ts });
    }
    errEl.textContent = '保存しました。';
    resetForm();
  });
</script>
</body>
</html>
